<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14171D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Standards">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Standards</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="main">

  <!-- ========== HEUTE ========== -->
  <section class="view" id="view-heute">
    <div class="daynav">
      <button class="daynav-btn" id="dayPrev" aria-label="Vorheriger Tag">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="daynav-label">
        <h1 id="dayLabel">Heute</h1>
        <p class="daynav-sub" id="daySub"></p>
      </div>
      <button class="daynav-btn" id="dayNext" aria-label="Nächster Tag">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <h2 class="section-title">Täglich</h2>
    <div class="card" id="dailyList"></div>

    <h2 class="section-title" id="weekTitle">Diese Woche</h2>
    <div class="card" id="quotaList"></div>

    <div id="reflectionSlot"></div>

    <p class="footnote" id="heuteFootnote"></p>
  </section>

  <!-- ========== RÜCKSCHAU ========== -->
  <section class="view hidden" id="view-rueckschau">
    <div class="daynav">
      <button class="daynav-btn" id="monthPrev" aria-label="Vorheriger Monat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="daynav-label">
        <h1 id="monthLabel">Monat</h1>
        <p class="daynav-sub">Rückschau</p>
      </div>
      <button class="daynav-btn" id="monthNext" aria-label="Nächster Monat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div id="rueckschauBody">
      <p class="placeholder">Wird im nächsten Schritt gebaut.</p>
    </div>
  </section>

  <!-- ========== EINSTELLUNGEN ========== -->
  <section class="view hidden" id="view-einstellungen">
    <div class="daynav daynav-plain">
      <div class="daynav-label">
        <h1>Einstellungen</h1>
        <p class="daynav-sub">Habits, Sicherung, Darstellung</p>
      </div>
    </div>
    <div id="einstellungenBody">
      <p class="placeholder">Wird im nächsten Schritt gebaut.</p>
    </div>
  </section>

</main>

<nav class="tabbar" id="tabbar">
  <button class="tab is-active" data-view="heute">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>
    <span>Heute</span>
  </button>
  <button class="tab" data-view="rueckschau">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/></svg>
    <span>Rückschau</span>
  </button>
  <button class="tab" data-view="einstellungen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10l-1.4 1.4"/></svg>
    <span>Mehr</span>
  </button>
</nav>

<script src="js/dates.js"></script>
<script src="js/questions.js"></script>
<script src="js/storage.js"></script>
<script src="js/stats.js"></script>
<script src="js/app.js"></script>
</body>
</html>
